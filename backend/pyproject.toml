[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "musicshare-backend"
version = "0.1.0"
description = "MusicShare Serverless Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "pydantic[email]>=2.6.0",
    "email-validator>=2.0.0",
    "python-dateutil>=2.8.2",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]

[tool.setuptools]
packages = ["shared", "shared.models", "shared.repositories", "shared.services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestRemovedIn10Warning",
    "ignore::pytest.PytestWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["dist", "musicshare_backend.egg-info", ".pytest_cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
